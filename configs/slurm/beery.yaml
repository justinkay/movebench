# Shared defaults for package-backed Slurm launchers.
# Pass with: --slurm-config configs/slurm/beery.yaml

defaults:
  partition: vision-beery
  qos: vision-beery-main
  account: vision-beery
  mem: 64GB
  polling_interval: 30

commands:
  extract:
    time: 2-00:00:00
    cpus_per_task: 16
    gpus_per_node: 0
    max_concurrent_jobs: 32
    log_dir: results/slurm/extract_points

  bench:
    time: 2-00:00:00
    cpus_per_task: 16
    # gpus_per_node set by methods
    max_cpu_jobs: 32
    max_gpu_jobs: 32
    log_dir: results/slurm/bench

  pack:
    time: 2-00:00:00
    cpus_per_task: 16
    gpus_per_node: 0
    max_concurrent_jobs: 32
    log_dir: results/slurm/pack

  zip_rasters:
    time: 4-00:00:00
    cpus_per_task: 1
    gpus_per_node: 0
    log_dir: results/slurm/zip_rasters

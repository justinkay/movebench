version: 2

layers_config: configs/layers_all.yaml
output_dir: results/benchmarks

wandb:
  enabled: true
  project: movebench
  entity: justinkay # TODO env variable
  mode: online

runtime:
  device: cuda
  seed: 0
  setup_workers: 16
  max_eval_steps: 2500

datasets:
  issf:
    batch_size: 32
    num_workers: 32
    normalize: true
    include_time: true
    sampler:
      num_candidates: 100
      random_seed: 0
      step_multiplier: 2.0
      step_q: 0.95
      gap_q: 0.999
      bounds_buffer_deg: 0.01

  deepssf:
    batch_size: 32
    num_workers: 32
    output_hw: [101, 101]
    normalize: true
    step_multiplier: 2.0
    step_q: 0.95
    gap_q: 0.999

  moveformer:
    batch_size: 24
    num_workers: 8
    max_len: 500
    min_len: 2
    normalize_env: true
    require_normalization_stats: false

methods:
  - name: issf_linear
    kind: issf_linear
    hparams:
      lr: 0.01
      weight_decay: 0.001
    schedule:
      max_steps: 1000
      eval_interval: 50
      patience: 20

  - name: issf_mlp
    kind: issf_mlp
    model:
      hidden_dims: [128]
      dropout: 0.6
    hparams:
      lr: 0.001
      weight_decay: 0.0001
    schedule:
      max_steps: 2000
      eval_interval: 50
      patience: 20

  - name: deepssf
    kind: deepssf
    model:
      image_dim: 101
    hparams:
      lr_movement: 0.00001
      lr_habitat: 0.0001
      weight_decay: 0.0
    schedule:
      max_steps: 3000
      eval_interval: 100
      patience: 10

  - name: moveformer
    kind: moveformer
    hparams:
      lr: 0.00005
      weight_decay: 0.0
      warmup_steps: 1000
      lr_gamma: 0.98
    schedule:
      max_steps: 5000
      eval_interval: 200
      patience: 10

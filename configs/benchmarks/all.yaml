version: 1

layers_config: configs/layers/all.yaml
sampler_config: configs/samplers/issf_defaults.yaml
output_dir: results/benchmarks

runtime:
  device: cuda
  seed: 0
  setup_workers: 16
  max_eval_steps: 2500

datasets:
  issf:
    batch_size: 32
    num_workers: 32
    normalize: true
    include_time: true

  deepssf:
    batch_size: 32
    num_workers: 32
    output_hw: [101, 101]
    normalize: true

  moveformer:
    batch_size: 24
    num_workers: 8
    max_len: 500
    min_len: 2
    normalize_env: true
    require_normalization_stats: false

methods:
  - name: issf_linear
    kind: issf_linear
    hparams:
      lr: 0.01
      weight_decay: 0.001
      max_epochs: 50
      eval_every_epochs: 1
      patience_epochs: 5

  - name: issf_mlp
    kind: issf_mlp
    model:
      hidden_dims: [128]
      dropout: 0.6
    hparams:
      lr: 0.001
      weight_decay: 0.0001
      max_epochs: 50
      eval_every_epochs: 1
      patience_epochs: 5

  - name: deepssf
    kind: deepssf
    model:
      image_dim: 101
    hparams:
      lr_movement: 0.00001
      lr_habitat: 0.0001
      weight_decay: 0.0
      max_epochs: 100
      eval_every_epochs: 1
      patience_epochs: 5

  - name: moveformer
    kind: moveformer
    hparams:
      lr: 0.00005
      weight_decay: 0.0
      warmup_steps: 1000
      lr_gamma: 0.98
      max_epochs: 180
      eval_every_epochs: 1
      patience_epochs: 10

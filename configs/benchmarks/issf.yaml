version: 1

layers_config: configs/layers_all.yaml
output_dir: results/benchmarks

# Optional W&B logging (disabled by default).
wandb:
  enabled: true
  project: movebench
  entity: justinkay
  mode: online  # or offline

runtime:
  device: cuda
  seed: 0
  setup_workers: 16
  max_eval_steps: 2500

datasets:
  issf:
    batch_size: 32
    num_workers: 32
    normalize: true
    include_time: true
    sampler:
      num_candidates: 100
      random_seed: 0
      step_multiplier: 2.0
      step_q: 0.95
      gap_q: 0.999
      bounds_buffer_deg: 0.01

methods:
  - name: issf_linear
    kind: issf_linear
    hparams:
      lr: 0.01
      weight_decay: 0.001
      max_epochs: 50
      eval_every_epochs: 1
      patience_epochs: 5

  - name: issf_mlp
    kind: issf_mlp
    model:
      hidden_dims: [128]
      dropout: 0.6
    hparams:
      lr: 0.001
      weight_decay: 0.0001
      max_epochs: 50
      eval_every_epochs: 1
      patience_epochs: 5

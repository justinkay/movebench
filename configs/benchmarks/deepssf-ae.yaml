version: 1

layers_config: configs/layers/all_ae_native.yaml
sampler_config: configs/samplers/issf_defaults.yaml
output_dir: results/benchmarks_ae

runtime:
  device: cuda
  seed: 0
  setup_workers: 16
  max_eval_steps: 2500

datasets:
  issf:
    batch_size: 32
    num_workers: 8
    normalize: true
    include_time: true

  deepssf:
    cache:
      enabled: true
      build_if_missing: false
    batch_size: 32
    num_workers: 8
    output_hw: [101, 101]
    normalize: true

methods:
  - name: deepssf
    kind: deepssf
    model:
      image_dim: 101
    hparams:
      lr_movement: 0.00001
      lr_habitat: 0.0001
      weight_decay: 0.0
      max_epochs: 100
      eval_every_epochs: 1
      patience_epochs: 5

version: 2

layers_config: configs/layers_all.yaml
output_dir: results/benchmarks

wandb:
  enabled: true
  project: movebench
  entity: justinkay # TODO env variable
  mode: online

runtime:
  device: cuda
  seed: 0
  setup_workers: 16
  max_eval_steps: 2500

datasets:
  issf:
    batch_size: 32
    num_workers: 8
    normalize: true
    include_time: true
    sampler:
      num_candidates: 100
      random_seed: 0
      step_multiplier: 2.0
      step_q: 0.95
      gap_q: 0.999
      bounds_buffer_deg: 0.01

  deepssf:
    cache:
      enabled: true
      build_if_missing: false
    batch_size: 32
    num_workers: 8
    output_hw: [101, 101]
    normalize: true
    step_multiplier: 2.0
    step_q: 0.95
    gap_q: 0.999

methods:
  - name: deepssf
    kind: deepssf
    model:
      image_dim: 101
    hparams:
      lr_movement: 0.00001
      lr_habitat: 0.0001
      weight_decay: 0.0
    schedule:
      max_steps: 3000
      eval_interval: 100
      patience: 10

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movebench"
version = "0.0.0"
description = "MoveBench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
  "earthengine-api",
  "numpy",
  "pandas",
  "requests",
  "scipy",
  "torch",
  "tqdm",
  "webdataset",
]
# removed rasterio and pyproj - should be installed with conda

[project.scripts]
movebench = "movebench.cli.main:main"

[project.optional-dependencies]
apps = [
  "cartopy",
  "matplotlib",
  "pydeck",
  "streamlit",
  "fastapi",
  "uvicorn",
]

# Optional: Weights & Biases experiment tracking/logging.
wandb = [
  "wandb>=0.16",
]

# MoveFormer baseline (vendored in movebench/lib/moveformer)
moveformer = [
  "einops",
  "entmax",
  "jsonargparse[signatures]",
  "numba",
  "pytorch-lightning>=2,<3",
  "x-transformers==0.25.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["movebench*"]

[tool.ruff]
extend-exclude = ["tests", "notebooks", "one_time_scripts", "mbr", "movebank", "execplans", "results", "docs", "movebench/lib","app/"]

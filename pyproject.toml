[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movebench"
version = "0.0.0"
description = "MoveBench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
  "earthengine-api",
  "numpy",
  "pandas",
  "pyproj",
  "rasterio",
  "requests",
  "scipy",
  "torch",
  "tqdm",
]

[project.optional-dependencies]
# Streamlit trajectory review app (app.py)
review-app = [
  "cartopy",
  "matplotlib",
  "streamlit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["movebench",]

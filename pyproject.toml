[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movebench"
version = "0.0.0"
description = "MoveBench (research code)"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy",
  "pandas",
  "rasterio",
  "pyproj",
  "torch",
  "tqdm",
  "requests",
  "scipy",
  "earthengine-api",
]
